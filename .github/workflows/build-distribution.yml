name: Build Arlo distributions

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NODE_VERSION: 20

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: arlo-web, path: dist }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }}, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: arlo-android-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Build signed release APK when signing secrets exist
        if: ${{ secrets.ARLO_KEYSTORE_BASE64 != '' && secrets.ARLO_KEYSTORE_PASSWORD != '' && secrets.ARLO_KEY_ALIAS != '' && secrets.ARLO_KEY_PASSWORD != '' }}
        env:
          ARLO_KEYSTORE_BASE64: ${{ secrets.ARLO_KEYSTORE_BASE64 }}
          ARLO_KEYSTORE_PASSWORD: ${{ secrets.ARLO_KEYSTORE_PASSWORD }}
          ARLO_KEY_ALIAS: ${{ secrets.ARLO_KEY_ALIAS }}
          ARLO_KEY_PASSWORD: ${{ secrets.ARLO_KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          echo "$ARLO_KEYSTORE_BASE64" | base64 --decode > android/app/arlo-release.keystore
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s += '''\nandroid {\n  signingConfigs { release { storeFile file("arlo-release.keystore"); storePassword System.getenv("ARLO_KEYSTORE_PASSWORD"); keyAlias System.getenv("ARLO_KEY_ALIAS"); keyPassword System.getenv("ARLO_KEY_PASSWORD") } }\n  buildTypes { release { signingConfig signingConfigs.release } }\n}\n'''
          p.write_text(s)
          PY
          cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with: { name: arlo-android-release, path: android/app/build/outputs/apk/release/*.apk, if-no-files-found: ignore }
