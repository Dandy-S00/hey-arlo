services:
  arlo-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: arlo:web
    container_name: arlo-web
    restart: unless-stopped
    ports:
      - "${ARLO_PORT:-8080}:80"
    depends_on:
      arlo-api:
        condition: service_healthy
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
  arlo-api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: arlo:api
    container_name: arlo-api
    restart: unless-stopped
    expose: ["3001"]
    environment:
      PORT: 3001
      ARLO_API_KEY: ${ARLO_API_KEY:?set ARLO_API_KEY}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
