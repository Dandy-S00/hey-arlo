services:
  arlo:
    build:
      context: .
      dockerfile: Dockerfile
    image: arlo:local
    container_name: arlo
    restart: unless-stopped
    ports:
      - "${ARLO_PORT:-8080}:8080"
    environment:
      PORT: 8080
      APP_VERSION: ${APP_VERSION:-local}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
